<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ingreso</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="container simple-card">
        <div class="form-box">
            <form id="loginForm">
                <h1>Reporte Diario</h1>
                <p>Ingrese los datos de la jornada</p>

                <div class="input-box">
                    <input type="text" id="username" placeholder="Nombre (ej: Nico)" required>
                    <i class='bx bxs-user'></i>
                </div>

                <!-- Disable password, reused as hidden or removed entirely -->

                <div class="input-box">
                    <select id="loginProject" required>
                        <option value="" disabled selected>Seleccione Proyecto</option>
                        <option value="loading">Cargando...</option>
                    </select>
                    <i class='bx bx-briefcase-alt-2'></i>
                </div>

                <div class="input-box">
                    <select id="loginPhase" required>
                        <option value="" disabled selected>Seleccione Fase</option>
                        <option value="loading">Cargando...</option>
                    </select>
                    <i class='bx bx-layer'></i>
                </div>

                <div class="input-box">
                    <input type="number" id="loginHours" placeholder="Horas (ej: 8.5)" step="0.5" required>
                    <i class='bx bx-time'></i>
                </div>

                <div class="input-box">
                    <input type="text" id="loginNotes" placeholder="Nota opcional">
                    <i class='bx bx-notepad'></i>
                </div>

                <button type="submit" class="btn">Enviar Reporte</button>
                <p id="error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- No more toggle, no more dashboard hidden div -->

    <script src="script.js?v=4"></script>
</body>

</html>
