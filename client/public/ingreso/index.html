<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ingreso</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-icon">
                <i class='bx bxs-hard-hat'></i>
            </div>
            <h1>Control de Ingreso</h1>
            <p class="subtitle">Botello Builders Inc.</p>
        </div>

        <div class="form-box">
            <form id="loginForm">
                <div className="input-box">
                    <label>Trabajador</label>
                    <div class="input-interface">
                        <input type="text" id="username" placeholder="Tu nombre..." required>
                        <i class='bx bxs-user'></i>
                    </div>
                </div>

                <div class="input-box">
                    <label>Proyecto</label>
                    <div class="input-interface">
                        <select id="loginProject" required>
                            <option value="" disabled selected>Seleccione Proyecto</option>
                            <option value="loading">Cargando...</option>
                        </select>
                        <i class='bx bx-briefcase-alt-2'></i>
                    </div>
                </div>

                <div class="input-box">
                    <label>Fase de Trabajo</label>
                    <div class="input-interface">
                        <select id="loginPhase" required>
                            <option value="" disabled selected>Seleccione Fase</option>
                            <option value="loading">Cargando...</option>
                        </select>
                        <i class='bx bx-layer'></i>
                    </div>
                </div>

                <div class="input-box">
                    <label>Horas Trabajadas</label>
                    <div class="input-interface">
                        <input type="number" id="loginHours" placeholder="Ej: 8.5" step="0.5" required>
                        <i class='bx bx-time'></i>
                    </div>
                </div>

                <div class="input-box">
                    <label>Notas / Observaciones</label>
                    <div class="input-interface">
                        <input type="text" id="loginNotes" placeholder="Detalles del día...">
                        <i class='bx bx-notepad'></i>
                    </div>
                </div>

                <button type="submit" class="btn">
                    <span>Enviar Reporte</span>
                    <i class='bx bx-send'></i>
                </button>
                <p id="error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- No more toggle, no more dashboard hidden div -->

    <script src="script.js?v=4"></script>
</body>

</html>
